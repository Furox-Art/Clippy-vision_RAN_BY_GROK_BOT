name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt
        continue-on-error: true
      
      - name: List installed packages
        run: pip list
      
      - name: Run tests with markers
        run: |
          pytest tests/ -v --tb=short \
            -m "not gui and not requires_ollama and not requires_system_apis" \
            --co -q || echo "Test collection completed"
          pytest tests/ -v --tb=short \
            -m "not gui and not requires_ollama and not requires_system_apis" \
            || echo "Some tests failed or were skipped"
        continue-on-error: true
      
      - name: Run all tests (allow failures)
        run: pytest tests/ -v --tb=short || echo "Tests completed with some failures/skips"
        continue-on-error: true
      
      - name: Test summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Python**: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Skipped/Failed Tests" >> $GITHUB_STEP_SUMMARY
          echo "Tests requiring GUI, Ollama, or system-specific APIs (UI Automation, AX APIs) are skipped in CI." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Categories skipped:**" >> $GITHUB_STEP_SUMMARY
          echo "- GUI tests (require Electron, display)" >> $GITHUB_STEP_SUMMARY
          echo "- Ollama tests (require running Ollama server)" >> $GITHUB_STEP_SUMMARY
          echo "- System API tests (Windows UI Automation, macOS AX APIs)" >> $GITHUB_STEP_SUMMARY
        shell: bash
